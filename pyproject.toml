[project]
name = "launch-detector-mcp"
version = "0.1.0"
description = "MCP server: spot unannounced products from new subdomains in certificate transparency logs (crt.sh). No API keys."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ali Altunar" }]
keywords = ["mcp", "model-context-protocol", "certificate-transparency", "crt.sh", "competitive-intelligence", "subdomains", "osint", "claude"]
dependencies = [
  "mcp>=2.2,<3",
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/alialtunar/launch-detector-mcp"
Repository = "https://github.com/alialtunar/launch-detector-mcp"
Issues = "https://github.com/alialtunar/launch-detector-mcp/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
launch-detector-mcp = "launch_detector.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/launch_detector"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
